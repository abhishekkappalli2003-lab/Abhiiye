<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine 💜</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#2b1055,#120021 70%);
    overflow:hidden;
}

/* Container – Insta Story Ratio */
.container{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(25px);
    border-radius:28px;
    padding:28px;
    max-width:360px;
    width:100%;
    aspect-ratio:9/16;
    box-shadow:0 0 50px rgba(255,110,199,.35);
    color:white;
    text-align:center;
    position:relative;
}

/* Titles */
h1{
    font-size:22px;
    background:linear-gradient(45deg,#ff6ec7,#ffd1ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.subtitle{font-size:14px;color:#ffd6ff;margin:10px 0 20px}

/* Inputs */
label{display:block;text-align:left;font-size:13px;color:#ffd6ff;margin-bottom:6px}
input,select{
    width:100%;
    padding:12px;
    border-radius:14px;
    border:none;
    background:rgba(255,255,255,.15);
    color:white;
    margin-bottom:14px;
}
input::placeholder{color:#ddd}

/* Buttons */
.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:18px;
    font-weight:700;
    background:linear-gradient(135deg,#ff6ec7,#ffd1ff);
    color:#120021;
    cursor:pointer;
    box-shadow:0 0 18px rgba(255,110,199,.6);
}
.btn:active{transform:scale(.97)}

.generated-link{display:none;margin-top:15px}
.link-box{
    background:black;
    color:#ff9de2;
    padding:10px;
    border-radius:12px;
    font-size:12px;
    word-break:break-all;
}

/* Valentine */
.valentine-section{display:none}

.neon-heart{
    width:110px;
    margin:20px auto;
    animation:pulse 1.6s infinite;
}
@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.15)}
}

.valentine-title{
    font-size:22px;
    min-height:60px;
}

/* Buttons */
.button-container{
    display:flex;
    gap:16px;
    justify-content:center;
    margin-top:18px;
    position:relative;
}

.yes-btn{
    padding:14px 38px;
    border:none;
    border-radius:28px;
    background:linear-gradient(45deg,#ff6ec7,#ffd1ff);
    font-weight:800;
    transition:transform .25s ease, box-shadow .25s ease;
}

.no-btn{
    padding:14px 30px;
    border:none;
    border-radius:28px;
    background:#444;
    color:white;
    opacity:1 !important;
    visibility:visible !important;
    display:inline-block !important;
    transition:left .25s ease, top .25s ease;
}

.no-btn.moving{
    position:absolute;
}

/* Try again text */
#tryAgainText{
    position:absolute;
    bottom:-20px;
    font-size:12px;
    color:#ffd6ff;
    opacity:0;
    transition:opacity .3s ease;
}

/* Success */
.success-message{display:none}
.success-text{font-size:28px;color:#ffd1ff;margin-top:15px}

/* Confetti hearts */
.confetti{
    position:fixed;
    top:50%;
    left:50%;
    width:12px;
    height:12px;
    background:#ff6ec7;
    clip-path:path("M12 21s-6.7-4.4-9.3-8C.6 9.3 2.4 5 6.5 5c2 0 3.4 1.2 4.5 2.6C12.1 6.2 13.5 5 15.5 5 19.6 5 21.4 9.3 21.3 13c-2.6 3.6-9.3 8-9.3 8z");
    animation:explode 1s ease-out forwards;
}
@keyframes explode{
    to{
        transform:translate(var(--x),var(--y)) rotate(720deg) scale(0);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- GENERATOR -->
<div id="generatorSection">
    <h1>Valentine Link 💜</h1>
    <p class="subtitle">Create a surprise they’ll never forget</p>

    <label>Your Name</label>
    <input id="fromName" placeholder="Your name">

    <label>Valentine Name</label>
    <input id="toName" placeholder="Their name">

    <button class="btn" id="generateBtn">Generate Link</button>

    <div class="generated-link" id="generatedLink">
        <div class="link-box" id="linkDisplay"></div>
        <button class="btn" id="copyBtn">Copy Link</button>
    </div>
</div>

<!-- VALENTINE -->
<div class="valentine-section" id="valentineSection">

    <svg class="neon-heart" viewBox="0 0 24 24">
        <path fill="#ff6ec7" d="M12 21s-6.7-4.4-9.3-8C.6 9.3 2.4 5 6.5 5c2 0 3.4 1.2 4.5 2.6C12.1 6.2 13.5 5 15.5 5 19.6 5 21.4 9.3 21.3 13c-2.6 3.6-9.3 8-9.3 8z"/>
    </svg>

    <h2 class="valentine-title" id="typingText"></h2>

    <select id="songSelect">
        <option value="https://cdn.pixabay.com/audio/2023/02/28/audio_06b8a3d5ad.mp3">💜 Romantic Piano</option>
        <option value="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8c9b08c.mp3">💖 Soft Guitar</option>
        <option value="https://cdn.pixabay.com/audio/2022/10/26/audio_3c1f2b8b8e.mp3">💘 Dreamy Love</option>
    </select>

    <div class="button-container">
        <button class="yes-btn" id="yesBtn">YES 💘</button>
        <button class="no-btn" id="noBtn">No 🙈</button>
        <div id="tryAgainText">😅 try again</div>
    </div>

    <div class="success-message" id="successMessage">
        <h2 class="success-text">It’s a YES 💜</h2>
        <p><span id="fromNameSuccess"></span> is smiling 😍</p>
    </div>
</div>

<audio id="loveMusic"></audio>

</div>

<script>
const params=new URLSearchParams(location.search)

// PAGE LOAD
if(params.get("from")&&params.get("to")){
    generatorSection.style.display="none"
    valentineSection.style.display="block"
    fromNameSuccess.textContent=params.get("from")
    typeText(`${params.get("to")}, will you be my Valentine?`)
    initNo()
}else{
    generateBtn.onclick=generateLink
}

// GENERATE LINK
function generateLink(){
    const link=`${location.origin}${location.pathname}?from=${fromName.value}&to=${toName.value}`
    linkDisplay.textContent=link
    generatedLink.style.display="block"
}
copyBtn.onclick=()=>{
    navigator.clipboard.writeText(linkDisplay.textContent)
    copyBtn.textContent="Copied ❤️"
    setTimeout(()=>copyBtn.textContent="Copy Link",1200)
}

// NO BUTTON LOGIC
function initNo(){
    const container=document.querySelector(".container")
    const tryAgain=document.getElementById("tryAgainText")
    let growCount=0

    function moveNo(){
        noBtn.classList.add("moving")

        const c=container.getBoundingClientRect()
        const b=noBtn.getBoundingClientRect()

        noBtn.style.left=Math.random()*(c.width-b.width-20)+"px"
        noBtn.style.top=Math.random()*(c.height-b.height-20)+"px"

        tryAgain.style.opacity="1"
        setTimeout(()=>tryAgain.style.opacity="0",900)

        growCount++
        const scale=Math.min(1+growCount*0.08,1.6)
        const glow=Math.min(20+growCount*10,60)

        yesBtn.style.transform=`scale(${scale})`
        yesBtn.style.boxShadow=`0 0 ${glow}px #ffd1ff`
    }

    noBtn.onmouseenter=moveNo
    noBtn.onclick=(e)=>{
        e.preventDefault()
        moveNo()
        if(navigator.vibrate) navigator.vibrate(120)
    }
}

// YES BUTTON
yesBtn.onclick=()=>{
    loveMusic.src=songSelect.value
    loveMusic.play()
    explodeHearts()
    successMessage.style.display="block"
}

// CONFETTI
function explodeHearts(){
    for(let i=0;i<30;i++){
        const h=document.createElement("div")
        h.className="confetti"
        h.style.setProperty("--x",(Math.random()*600-300)+"px")
        h.style.setProperty("--y",(Math.random()*600-300)+"px")
        document.body.appendChild(h)
        setTimeout(()=>h.remove(),1000)
    }
}

// TYPING
function typeText(text){
    let i=0
    typingText.textContent=""
    const t=setInterval(()=>{
        typingText.textContent+=text[i++]
        if(i===text.length)clearInterval(t)
    },60)
}
</script>

</body>
</html>
