<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine 💜</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

/* BACKGROUND WITH PHOTO */
body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        linear-gradient(rgba(18,0,33,0.55), rgba(18,0,33,0.55)),
        url("bg.jpg") center/cover no-repeat;
}

/* CARD */
.container{
    background:linear-gradient(rgba(255,255,255,0.12), rgba(255,255,255,0.06));
    backdrop-filter: blur(6px);
    border-radius:28px;
    padding:28px;
    max-width:360px;
    width:100%;
    aspect-ratio:9/16;
    box-shadow:0 0 60px rgba(255,110,199,.45);
    color:white;
    text-align:center;
    position:relative;
    overflow:hidden;
}

/* TEXT */
h1{
    font-size:22px;
    background:linear-gradient(45deg,#ff6ec7,#ffd1ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.subtitle{font-size:14px;color:#ffd6ff;margin:10px 0 20px}

/* INPUTS */
label{display:block;text-align:left;font-size:13px;color:#ffd6ff;margin-bottom:6px}
input{
    width:100%;
    padding:12px;
    border-radius:14px;
    border:none;
    background:rgba(255,255,255,.2);
    color:white;
    margin-bottom:14px;
}

/* BUTTONS */
.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:18px;
    font-weight:700;
    background:linear-gradient(135deg,#ff6ec7,#ffd1ff);
    color:#120021;
    cursor:pointer;
}

/* GENERATOR */
.generated-link{display:none;margin-top:15px}
.link-box{
    background:black;
    color:#ff9de2;
    padding:10px;
    border-radius:12px;
    font-size:12px;
    word-break:break-all;
}

/* VALENTINE */
.valentine-section{display:none}

.neon-heart{
    width:110px;
    margin:20px auto;
    animation:pulse 1.6s infinite;
}
@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.15)}
}

.valentine-title{
    font-size:22px;
    min-height:60px;
}

/* BUTTON AREA */
.button-container{
    position:relative;
    height:100px;
    margin-top:20px;
}

/* YES */
.yes-btn{
    padding:14px 38px;
    border:none;
    border-radius:28px;
    background:linear-gradient(45deg,#ff6ec7,#ffd1ff);
    font-weight:800;
    transition:transform .25s ease, box-shadow .25s ease;
}

/* NO */
.no-btn{
    position:absolute;
    top:60px;
    left:0;
    padding:14px 30px;
    border:none;
    border-radius:28px;
    background:#444;
    color:white;
    transition:left .2s ease;
}

/* TRY AGAIN */
#tryAgainText{
    font-size:12px;
    color:#ffd6ff;
    opacity:0;
    margin-top:6px;
    transition:opacity .3s ease;
}

/* SUCCESS */
.success-message{display:none}
.success-text{font-size:28px;color:#ffd1ff;margin-top:20px}

/* CONFETTI */
.confetti{
    position:fixed;
    top:50%;
    left:50%;
    width:12px;
    height:12px;
    background:#ff6ec7;
    animation:explode 1s ease-out forwards;
}
@keyframes explode{
    to{
        transform:translate(var(--x),var(--y)) rotate(720deg) scale(0);
        opacity:0;
    }
}

/* PHOTO POPUP */
.photo-popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}
.photo-popup img{
    max-width:90%;
    max-height:90%;
    border-radius:20px;
    animation:pop 0.6s ease;
}
@keyframes pop{
    from{transform:scale(0.4);opacity:0}
    to{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<!-- PHOTO POPUP -->
<div class="photo-popup" id="photoPopup">
    <img src="bg.jpg" alt="Our moment">
</div>

<div class="container">

<!-- GENERATOR -->
<div id="generatorSection">
    <h1>Valentine Link 💜</h1>
    <p class="subtitle">Create a surprise they’ll never forget</p>

    <label>Your Name</label>
    <input id="fromName">

    <label>Valentine Name</label>
    <input id="toName">

    <button class="btn" id="generateBtn">Generate Link</button>

    <div class="generated-link" id="generatedLink">
        <div class="link-box" id="linkDisplay"></div>
        <button class="btn" id="copyBtn">Copy Link</button>
    </div>
</div>

<!-- VALENTINE -->
<div class="valentine-section" id="valentineSection">

    <svg class="neon-heart" viewBox="0 0 24 24">
        <path fill="#ff6ec7"
        d="M12 21s-6.7-4.4-9.3-8C.6 9.3 2.4 5 6.5 5c2 0 3.4 1.2 4.5 2.6C12.1 6.2 13.5 5 15.5 5 19.6 5 21.4 9.3 21.3 13c-2.6 3.6-9.3 8-9.3 8z"/>
    </svg>

    <h2 class="valentine-title" id="typingText"></h2>

    <div class="button-container">
        <button class="yes-btn" id="yesBtn">YES 💘</button>
        <button class="no-btn" id="noBtn">No 🙈</button>
    </div>

    <div id="tryAgainText">😅 try again</div>

    <div class="success-message" id="successMessage">
        <h2 class="success-text">It’s a YES 💜</h2>
        <p><span id="fromNameSuccess"></span> is smiling 😍</p>
    </div>
</div>

<audio id="loveMusic">
    <source src="https://cdn.pixabay.com/audio/2023/02/28/audio_06b8a3d5ad.mp3">
</audio>

</div>

<script>
const params=new URLSearchParams(location.search)

if(params.get("from")&&params.get("to")){
    generatorSection.style.display="none"
    valentineSection.style.display="block"
    fromNameSuccess.textContent=params.get("from")
    typeText(`${params.get("to")}, will you be my Valentine?`)
    initNo()
}else{
    generateBtn.onclick=generateLink
}

function generateLink(){
    const link=`${location.origin}${location.pathname}?from=${fromName.value}&to=${toName.value}`
    linkDisplay.textContent=link
    generatedLink.style.display="block"
}

copyBtn.onclick=()=>navigator.clipboard.writeText(linkDisplay.textContent)

function initNo(){
    const container=document.querySelector(".button-container")
    const tryAgain=document.getElementById("tryAgainText")
    let grow=0
    let side=true

    function moveNo(){
        const maxX=container.clientWidth-noBtn.offsetWidth
        noBtn.style.left=side?maxX+"px":"0px"
        side=!side

        tryAgain.style.opacity=1
        setTimeout(()=>tryAgain.style.opacity=0,800)

        grow++
        yesBtn.style.transform=`scale(${Math.min(1+grow*0.08,1.6)})`
        yesBtn.style.boxShadow=`0 0 ${Math.min(20+grow*10,60)}px #ffd1ff`

        if(navigator.vibrate) navigator.vibrate(100)
    }

    noBtn.onmouseenter=moveNo
    noBtn.onclick=(e)=>{e.preventDefault();moveNo()}
}

yesBtn.onclick=()=>{
    noBtn.style.display="none"
    loveMusic.play()
    explode()
    successMessage.style.display="block"

    // PHOTO POPUP
    const popup=document.getElementById("photoPopup")
    popup.style.display="flex"
    popup.onclick=()=>popup.style.display="none"
}

function explode(){
    for(let i=0;i<25;i++){
        const c=document.createElement("div")
        c.className="confetti"
        c.style.setProperty("--x",(Math.random()*600-300)+"px")
        c.style.setProperty("--y",(Math.random()*600-300)+"px")
        document.body.appendChild(c)
        setTimeout(()=>c.remove(),1000)
    }
}

function typeText(text){
    let i=0
    typingText.textContent=""
    const t=setInterval(()=>{
        typingText.textContent+=text[i++]
        if(i===text.length)clearInterval(t)
    },60)
}
</script>

</body>
</html>
